name: Deploy Web Edition to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/static/**"
      - "shared/**"
      - "web/**"
      - "scripts/build_web_snapshot.py"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh market snapshot
        continue-on-error: true
        run: python scripts/build_web_snapshot.py

      - name: Prepare static site
        run: python web/prepare_pages.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mobile QA browser
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python -m http.server 4173 --directory site > /tmp/dividendfire-http.log 2>&1 &
          echo $! > /tmp/dividendfire-http.pid
          sleep 2
      - name: Mobile E2E QA
        run: npm run test:mobile
      - name: Upload mobile QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ux-qa
          path: test-results/mobile-390.png
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

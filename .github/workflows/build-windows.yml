name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve release version
        shell: pwsh
        run: |
          if (Test-Path "RELEASE_VERSION") {
            $tag = (Get-Content "RELEASE_VERSION" -Raw).Trim()
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v0.0.0"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version must look like v1.2.3"
          }
          $appVersion = $tag.Substring(1)
          $installerName = "DividendFIRE-Setup-$tag.exe"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify distribution sources
        shell: pwsh
        run: |
          python verify_distribution.py

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build ONEDIR application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm DividendFIRE.spec

      - name: Optional Authenticode sign application
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "Code signing not configured; continuing unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "DividendFIRE-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD "dist\DividendFIRE\DividendFIRE.exe"
          if ($LASTEXITCODE -ne 0) { throw "Application signing failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\DividendFIRE.iss"

      - name: Optional Authenticode sign installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "Code signing not configured; installer remains unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "DividendFIRE-signing.pfx"
          if (-not (Test-Path $certPath)) {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $target = Join-Path "release" $env:INSTALLER_NAME
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD $target
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $target = (Resolve-Path (Join-Path "release" $env:INSTALLER_NAME)).Path
          $report = Join-Path "release" "SECURITY_SCAN.txt"
          "Dividend FIRE Windows release security scan" | Out-File $report -Encoding utf8
          "UTC: $([DateTime]::UtcNow.ToString('u'))" | Out-File $report -Append -Encoding utf8
          "Target: $env:INSTALLER_NAME" | Out-File $report -Append -Encoding utf8
          $sig = Get-AuthenticodeSignature $target
          "Authenticode: $($sig.Status)" | Out-File $report -Append -Encoding utf8
          if ($sig.SignerCertificate) {
            "Signer: $($sig.SignerCertificate.Subject)" | Out-File $report -Append -Encoding utf8
          }
          $mpCandidates = @("$env:ProgramFiles\Windows Defender\MpCmdRun.exe")
          $platform = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          if (Test-Path $platform) {
            $latest = Get-ChildItem $platform -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if ($latest) { $mpCandidates += (Join-Path $latest.FullName "MpCmdRun.exe") }
          }
          $mp = $mpCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mp) { throw "Microsoft Defender command-line scanner not found" }
          "Defender scanner: $mp" | Out-File $report -Append -Encoding utf8
          & $mp -Scan -ScanType 3 -File $target 2>&1 | Tee-Object -FilePath $report -Append
          $scanExit = $LASTEXITCODE
          "Defender exit code: $scanExit" | Out-File $report -Append -Encoding utf8
          if ($scanExit -ne 0) {
            throw "Microsoft Defender scan did not return clean success (exit $scanExit)"
          }

      - name: Optional VirusTotal scan
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $report = Join-Path "release" "SECURITY_SCAN.txt"
          if ([string]::IsNullOrWhiteSpace($env:VT_API_KEY)) {
            "VirusTotal: SKIPPED (VT_API_KEY secret not configured)" | Out-File $report -Append -Encoding utf8
            exit 0
          }
          $target = (Resolve-Path (Join-Path "release" $env:INSTALLER_NAME)).Path
          $json = & curl.exe -sS --request POST --url "https://www.virustotal.com/api/v3/files" --header "x-apikey: $env:VT_API_KEY" --form "file=@$target"
          if ($LASTEXITCODE -ne 0) { throw "VirusTotal upload failed" }
          $upload = $json | ConvertFrom-Json
          $analysisId = $upload.data.id
          if (-not $analysisId) { throw "VirusTotal did not return an analysis id" }
          $completed = $false
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 10
            $analysis = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" -Headers @{"x-apikey"=$env:VT_API_KEY}
            if ($analysis.data.attributes.status -eq "completed") {
              $completed = $true
              $stats = $analysis.data.attributes.stats
              "VirusTotal malicious: $($stats.malicious)" | Out-File $report -Append -Encoding utf8
              "VirusTotal suspicious: $($stats.suspicious)" | Out-File $report -Append -Encoding utf8
              "VirusTotal harmless: $($stats.harmless)" | Out-File $report -Append -Encoding utf8
              "VirusTotal undetected: $($stats.undetected)" | Out-File $report -Append -Encoding utf8
              if (($stats.malicious + $stats.suspicious) -gt 0) {
                throw "VirusTotal reported malicious/suspicious detections"
              }
              break
            }
          }
          if (-not $completed) { throw "VirusTotal analysis timed out" }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $target = Join-Path "release" $env:INSTALLER_NAME
          $hash = Get-FileHash $target -Algorithm SHA256
          "SHA256  $($hash.Hash)  $env:INSTALLER_NAME" | Out-File "release\SHA256.txt" -Encoding ascii
          "SHA256: $($hash.Hash)" | Out-File "release\SECURITY_SCAN.txt" -Append -Encoding utf8

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DividendFIRE-Windows-Installer
          path: |
            release/${{ env.INSTALLER_NAME }}
            release/SHA256.txt
            release/SECURITY_SCAN.txt
          if-no-files-found: error

      - name: Detect RELEASE_VERSION change
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_request
        shell: pwsh
        run: |
          $changed = git diff --name-only HEAD^ HEAD
          if ($changed -contains "RELEASE_VERSION") {
            "publish=true" >> $env:GITHUB_OUTPUT
            "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          } else {
            "publish=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish requested GitHub Release
        if: steps.release_request.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_request.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dividend FIRE Simulator ${{ steps.release_request.outputs.tag }}
          body: |
            Windows 배포용 Dividend FIRE Simulator입니다.

            - 일반 사용자는 Python 설치가 필요 없습니다.
            - 표준 PyInstaller ONEDIR + Inno Setup 빌드입니다.
            - Microsoft Defender 빌드단계 검사를 통과한 설치파일만 Release에 게시됩니다.
            - 코드서명 인증서가 설정된 경우 앱과 설치파일을 Authenticode 서명합니다.
            - VT_API_KEY가 설정된 경우 VirusTotal 검사도 통과해야 게시됩니다.
            - SHA-256 및 SECURITY_SCAN.txt를 함께 제공합니다.
          files: |
            release/${{ env.INSTALLER_NAME }}
            release/SHA256.txt
            release/SECURITY_SCAN.txt

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ env.INSTALLER_NAME }}
            release/SHA256.txt
            release/SECURITY_SCAN.txt

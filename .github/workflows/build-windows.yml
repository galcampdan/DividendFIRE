name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify distribution sources
        shell: pwsh
        run: |
          python verify_distribution.py

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build ONEDIR application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm DividendFIRE.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\DividendFIRE.iss"

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = Get-FileHash "release\DividendFIRE-Setup-v1.0.0.exe" -Algorithm SHA256
          "SHA256  $($hash.Hash)  DividendFIRE-Setup-v1.0.0.exe" | Out-File "release\SHA256.txt" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DividendFIRE-Windows-Installer
          path: |
            release/DividendFIRE-Setup-v1.0.0.exe
            release/SHA256.txt
          if-no-files-found: error

      - name: Detect RELEASE_VERSION change
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_request
        shell: pwsh
        run: |
          $changed = git diff --name-only HEAD^ HEAD
          if ($changed -contains "RELEASE_VERSION") {
            $tag = (Get-Content "RELEASE_VERSION" -Raw).Trim()
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "RELEASE_VERSION must look like v1.2.3"
            }
            "publish=true" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
          } else {
            "publish=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish requested GitHub Release
        if: steps.release_request.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_request.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dividend FIRE Simulator ${{ steps.release_request.outputs.tag }}
          body: |
            Windows 배포용 Dividend FIRE Simulator입니다.

            - 일반 사용자는 Python 설치가 필요 없습니다.
            - 표준 PyInstaller ONEDIR + Inno Setup 빌드입니다.
            - 설치 파일과 SHA-256 검증 파일을 함께 제공합니다.
            - v8.9.3 시뮬레이션 기능과 명목/현재가치 hover 표시가 포함되어 있습니다.
          files: |
            release/DividendFIRE-Setup-v1.0.0.exe
            release/SHA256.txt

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/DividendFIRE-Setup-v1.0.0.exe
            release/SHA256.txt

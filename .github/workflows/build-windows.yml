name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      app_version: ${{ steps.version.outputs.app_version }}
      installer_name: ${{ steps.version.outputs.installer_name }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if (Test-Path "RELEASE_VERSION") {
            $tag = (Get-Content "RELEASE_VERSION" -Raw).Trim()
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v0.0.0"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version must look like v1.2.3"
          }

          $appVersion = $tag.Substring(1)
          $installerName = "DividendFIRE-Setup-$tag.exe"
          $publish = "false"

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $publish = "true"
          } elseif ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main") {
            $changed = git diff --name-only HEAD^ HEAD
            if ($changed -contains "RELEASE_VERSION") {
              $publish = "true"
            }
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify distribution sources
        shell: pwsh
        run: |
          python verify_distribution.py

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build ONEDIR application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm DividendFIRE.spec

      - name: Optional Authenticode sign application
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "Code signing not configured; continuing unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "DividendFIRE-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD "dist\DividendFIRE\DividendFIRE.exe"
          if ($LASTEXITCODE -ne 0) { throw "Application signing failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\DividendFIRE.iss"

      - name: Optional Authenticode sign installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "Code signing not configured; installer remains unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "DividendFIRE-signing.pfx"
          if (-not (Test-Path $certPath)) {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $target = Join-Path "release" $env:INSTALLER_NAME
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD $target
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }

      - name: Record Authenticode status
        shell: pwsh
        run: |
          $target = (Resolve-Path (Join-Path "release" $env:INSTALLER_NAME)).Path
          $sig = Get-AuthenticodeSignature $target
          "Authenticode status: $($sig.Status)" | Out-File "release\AUTHENTICODE.txt" -Encoding utf8
          if ($sig.SignerCertificate) {
            "Signer: $($sig.SignerCertificate.Subject)" | Out-File "release\AUTHENTICODE.txt" -Append -Encoding utf8
            "Thumbprint: $($sig.SignerCertificate.Thumbprint)" | Out-File "release\AUTHENTICODE.txt" -Append -Encoding utf8
          } else {
            "Signer: NONE" | Out-File "release\AUTHENTICODE.txt" -Append -Encoding utf8
          }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $target = Join-Path "release" $env:INSTALLER_NAME
          $hash = Get-FileHash $target -Algorithm SHA256
          "SHA256  $($hash.Hash)  $env:INSTALLER_NAME" | Out-File "release\SHA256.txt" -Encoding ascii

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DividendFIRE-Windows-Build
          path: |
            release/${{ env.INSTALLER_NAME }}
            release/SHA256.txt
            release/AUTHENTICODE.txt
          if-no-files-found: error

  security-gates:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: DividendFIRE-Windows-Build
          path: release

      - name: Install ClamAV
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam || true
          clamscan --version

      - name: ClamAV malware scan
        shell: bash
        run: |
          set -euo pipefail
          REPORT="release/SECURITY_SCAN.txt"
          TARGET="release/${{ needs.build-windows.outputs.installer_name }}"
          {
            echo "Dividend FIRE release security report"
            echo "Target: ${{ needs.build-windows.outputs.installer_name }}"
            echo "Release: ${{ needs.build-windows.outputs.release_tag }}"
            echo
            cat release/AUTHENTICODE.txt
            echo
            echo "ClamAV:"
            clamscan --version
          } > "$REPORT"

          set +e
          clamscan --infected "$TARGET" 2>&1 | tee -a "$REPORT"
          SCAN_EXIT=${PIPESTATUS[0]}
          set -e

          echo "ClamAV exit code: $SCAN_EXIT" >> "$REPORT"
          if [ "$SCAN_EXIT" -eq 1 ]; then
            echo "ClamAV result: DETECTION" >> "$REPORT"
            exit 1
          elif [ "$SCAN_EXIT" -ne 0 ]; then
            echo "ClamAV result: SCAN ERROR" >> "$REPORT"
            exit "$SCAN_EXIT"
          fi
          echo "ClamAV result: CLEAN" >> "$REPORT"

      - name: Optional VirusTotal scan
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          REPORT="release/SECURITY_SCAN.txt"
          TARGET="release/${{ needs.build-windows.outputs.installer_name }}"

          if [ -z "${VT_API_KEY:-}" ]; then
            echo "VirusTotal: SKIPPED (VT_API_KEY secret not configured)" >> "$REPORT"
            exit 0
          fi

          UPLOAD_JSON=$(curl -fsS --request POST             --url "https://www.virustotal.com/api/v3/files"             --header "x-apikey: $VT_API_KEY"             --form "file=@$TARGET")

          ANALYSIS_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$UPLOAD_JSON")
          if [ -z "$ANALYSIS_ID" ]; then
            echo "VirusTotal: upload returned no analysis id" >> "$REPORT"
            exit 1
          fi

          COMPLETE=0
          for i in $(seq 1 30); do
            sleep 10
            ANALYSIS_JSON=$(curl -fsS               --url "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID"               --header "x-apikey: $VT_API_KEY")
            STATUS=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["attributes"]["status"])' <<< "$ANALYSIS_JSON")
            if [ "$STATUS" = "completed" ]; then
              COMPLETE=1
              MALICIOUS=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["attributes"]["stats"]["malicious"])' <<< "$ANALYSIS_JSON")
              SUSPICIOUS=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["attributes"]["stats"]["suspicious"])' <<< "$ANALYSIS_JSON")
              HARMLESS=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["attributes"]["stats"]["harmless"])' <<< "$ANALYSIS_JSON")
              UNDETECTED=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["attributes"]["stats"]["undetected"])' <<< "$ANALYSIS_JSON")
              {
                echo "VirusTotal malicious: $MALICIOUS"
                echo "VirusTotal suspicious: $SUSPICIOUS"
                echo "VirusTotal harmless: $HARMLESS"
                echo "VirusTotal undetected: $UNDETECTED"
              } >> "$REPORT"
              if [ $((MALICIOUS + SUSPICIOUS)) -gt 0 ]; then
                exit 1
              fi
              break
            fi
          done

          if [ "$COMPLETE" -ne 1 ]; then
            echo "VirusTotal: analysis timed out" >> "$REPORT"
            exit 1
          fi
          echo "VirusTotal result: CLEAN" >> "$REPORT"

      - name: Append SHA-256
        shell: bash
        run: |
          cat release/SHA256.txt >> release/SECURITY_SCAN.txt

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: DividendFIRE-Security-Reports
          path: |
            release/SECURITY_SCAN.txt
            release/SHA256.txt
            release/AUTHENTICODE.txt
          if-no-files-found: error

  publish-release:
    needs: [build-windows, security-gates]
    if: needs.build-windows.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: DividendFIRE-Windows-Build
          path: release

      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          name: DividendFIRE-Security-Reports
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Dividend FIRE Simulator ${{ needs.build-windows.outputs.release_tag }}
          body: |
            Windows 배포용 Dividend FIRE Simulator입니다.

            - 일반 사용자는 Python 설치가 필요 없습니다.
            - 표준 PyInstaller ONEDIR + Inno Setup 빌드입니다.
            - ClamAV 보안 검사를 통과한 빌드만 Release에 게시됩니다.
            - 코드서명 인증서가 설정된 경우 Authenticode 서명됩니다.
            - VT_API_KEY가 설정된 경우 VirusTotal 검사도 통과해야 게시됩니다.
            - SECURITY_SCAN.txt와 SHA256.txt를 함께 제공합니다.
            - GitHub 호스팅 Windows runner의 Defender가 커스텀 파일 검사를 건너뛰는 현상이 확인되어, Defender 통과 여부를 Release 보안 근거로 사용하지 않습니다.
          files: |
            release/${{ needs.build-windows.outputs.installer_name }}
            release/SHA256.txt
            release/SECURITY_SCAN.txt
            release/AUTHENTICODE.txt
